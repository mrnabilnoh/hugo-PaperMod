name: Build Check

on:
  push:
    paths-ignore:
      - "images/**"
      - "LICENSE"
      - "README.md"
    branches:
      - master
      - exampleSite
  pull_request:
    paths-ignore:
      - "images/**"
      - "LICENSE"
      - "README.md"
    branches:
      - master
      - exampleSite
  workflow_dispatch:
    # manual run
    inputs:
      hugoVersion:
        description: "Hugo Version"
        required: false
        default: "0.146.0"

defaults:
  run:
    shell: bash

jobs:
  build-check:
    runs-on: ubuntu-latest
    env:
      # min_version from theme.toml
      HUGO_VERSION: ${{ github.event.inputs.hugoVersion || '0.146.0' }}
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: exampleSite

      - name: Get Theme
        run: git submodule update --init --recursive

      - name: Update theme to Latest commit
        run: git submodule update --remote --merge

      - name: Patch exampleSite for Hugo v${{ env.HUGO_VERSION }}
        run: |
          [ -f config.yml ] || { echo "Missing required file: config.yml"; exit 1; }
          [ -f content/posts/rich-content.md ] || { echo "Missing required file: content/posts/rich-content.md"; exit 1; }
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          config = Path("config.yml")
          rich_content = Path("content/posts/rich-content.md")

          config_content = config.read_text()
          if "pagination:" not in config_content:
              config_content, replaced = re.subn(
                  r"(?m)^paginate:\s*(\d+)\s*$",
                  r"pagination:\n  pagerSize: \1",
                  config_content,
                  count=1,
              )
              if replaced != 1:
                  sys.exit("Failed to patch config.yml: expected to find deprecated paginate key for migration but pattern was not found")
              config.write_text(config_content)

          rich_content_text = rich_content.read_text()
          if "twitter_simple user=" not in rich_content_text:
              rich_content_text, replaced = re.subn(
                  r"{{<\s*twitter_simple\s+(\d+)\s*>}}",
                  r'{{< twitter_simple user="GoHugoIO" id="\1" >}}',
                  rich_content_text,
                  count=1,
              )
              if replaced != 1:
                  sys.exit("Failed to patch content/posts/rich-content.md: expected to find twitter_simple positional shortcode for migration but pattern was not found")
              rich_content.write_text(rich_content_text)
          PY

      - name: Build with Hugo
        run: hugo --buildDrafts --gc
